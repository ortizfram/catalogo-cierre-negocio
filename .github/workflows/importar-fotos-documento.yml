          output = pathlib.Path('assets/documento')
          output.mkdir(parents=True, exist_ok=True)
          success = 0
          for p in photos:
              try:
                  request=urllib.request.Request(p['url'], headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      data=response.read()
                  im=Image.open(io.BytesIO(data))
                  im.convert('RGB').save(output/('foto-'+p['n']+'.webp'), 'WEBP', quality=85, method=4)
                  success += 1
                  print('OK',p['n'])
              except Exception as exc:
                  print('FAILED',p['n'],str(exc)[:150])
          print('FOTOS IMPORTADAS:',success,'DE',len(photos))
