          output.mkdir(parents=True,exist_ok=True)
          fails=[]
          for p in photos:
              try:
                  req=urllib.request.Request(p['url'],headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=45) as resp: data=resp.read()
                  im=Image.open(io.BytesIO(data))
                  im.convert('RGB').save(output/('foto-'+str(p['n']).zfill(2)+'.webp'),'WEBP',quality=88)
                  print('OK',p['n'])
              except Exception as ex:
                  fails.append(p['n'])
                  print('ERROR',p['n'],str(ex))
          print('RESULT',len(photos)-len(fails),'/',len(photos),'FAILED',fails)
          if fails: raise SystemExit(1)
          PY
      - name: Confirmar y publicar fotos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/documento/
          if ! git diff --cached --quiet; then
            git commit -m "Incorporar fotos originales adicionales del documento"
            git push
          fi
